name: Hippocratic AI
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
description: Hippocratic AI builds safety-focused generative AI agents for non-diagnostic
  healthcare tasks, powered by its Polaris constellation architecture. Polaris 5.0 is a
  multi-trillion-parameter constellation of specialized models clinically validated by U.S.-licensed
  clinicians. Hippocratic AI sells agents such as Nurse Co-Pilot and AI Front Door to health
  systems, payors, and life-sciences organizations through enterprise sales rather than a
  self-service public API.
